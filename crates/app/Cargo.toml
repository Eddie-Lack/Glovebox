[package]
name = "glovebox"
description = "Glovebox, a level editor for Glover (N64)"
version.workspace = true
edition.workspace = true

[dependencies]
glovebox-core = { path = "../core" }
glovebox-editor = { path = "../editor" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit", "clipboard", "links", "system_fonts"] }
# The emoji fonts have the arrows and symbols the buttons show
# "experimental" opens the widget themes: style.rs gives the buttons and fields their shapes with them
egui = { version = "0.37", features = ["monochrome_emoji_fonts", "experimental"] }
egui-wgpu = "0.37"
serde_json.workspace = true
png = "0.18"
pollster = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# rfd reports a file dialog that could not open only through the log
log = "0.4"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
pollster = "0.4"
png = "0.18"
serde_json = { workspace = true, features = ["float_roundtrip"] }

[build-dependencies]
winresource = "0.1"
png = "0.18"
