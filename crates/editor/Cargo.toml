[package]
name = "glovebox-editor"
description = "The editor's state and every edit, without a window"
version.workspace = true
edition.workspace = true

[dependencies]
glovebox-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The reference dumps hold doubles that must read back bit for bit
serde_json = { workspace = true, features = ["float_roundtrip"] }
