# Tests the app (the Rust crates in crates/) on Windows and Linux, builds it for Windows, checks the built program
# with its --self-test and packs the archive. The tests use made-up data: the ones that need the ROM skip themselves.
# Every run keeps the archive as an artifact of the run. A pushed tag that starts with v, or a manual run with a
# release tag given, also publishes it as a GitHub release.
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this new tag, made on the commit the run builds (for example v2.0.0)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - .github/workflows/app.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - mod/**
      - web/**
      - formats/**
      - app/**
      - tools/licenses.py
      - THIRD_PARTY_NOTICES.md
  pull_request:
    paths:
      - .github/workflows/app.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - mod/**
      - web/**
      - formats/**
      - app/**
      - tools/licenses.py
      - THIRD_PARTY_NOTICES.md

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag of a release, or nothing
  RELEASE_TAG: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Keep files byte for byte: the program compiles in mod/mod.bin and the tables
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: app-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: app-windows-
      # The runner has no graphics card. The click tests draw with Direct3D 12's software adapter (WARP).
      - run: cargo test --workspace --locked
      # A release takes its version from the tag. Other runs take Cargo.toml's, with -dev.
      - name: Version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([-.+][0-9A-Za-z.+-]+)?$') { throw "The release tag must look like v2.0.0" }
            $version = $env:RELEASE_TAG.Substring(1)
          } else {
            $meta = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
            $version = ($meta.packages | Where-Object { $_.name -eq "glovebox" }).version + "-dev"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - run: cargo build --release --locked -p glovebox
      # The program has no console: its report goes to a file, and the step waits for the process to end.
      - name: Self-test
        shell: pwsh
        env:
          GLOVEBOX_NO_MESSAGE_BOX: "1"
        run: |
          $p = Start-Process -FilePath target\release\glovebox.exe -ArgumentList "--self-test" -NoNewWindow -PassThru `
            -RedirectStandardOutput self-test.txt -RedirectStandardError self-test-errors.txt
          $handle = $p.Handle  # PowerShell loses the exit code without this
          $p.WaitForExit()
          Get-Content self-test.txt, self-test-errors.txt
          if ($p.ExitCode -ne 0) { throw "The self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path self-test.txt -SimpleMatch "Glovebox $env:APP_VERSION" -Quiet)) { throw "The program does not say it is version $env:APP_VERSION" }
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist\Glovebox | Out-Null
          Copy-Item target\release\glovebox.exe dist\Glovebox\Glovebox.exe
          Copy-Item app\README.txt, THIRD_PARTY_NOTICES.md dist\Glovebox\
          python tools\licenses.py dist\Glovebox\licenses --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "tools/licenses.py failed" }
          Compress-Archive -Path dist\Glovebox -DestinationPath "dist\Glovebox-$env:APP_VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Glovebox-windows
          path: dist/Glovebox-*.zip
          if-no-files-found: error
          # The release job attaches the archive to the release, so the run's copy is only kept for a week.
          retention-days: 7

  # The same tests on Linux, drawn by Mesa's software Vulkan (lavapipe). The app is not built for release here.
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: app-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: app-linux-
      - run: cargo test --workspace --locked

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [build, test-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Glovebox-*
          path: dist
          merge-multiple: true
      - run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
