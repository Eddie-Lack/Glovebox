# Builds the desktop app (tools/build_app.py) for Windows, checks it with its --self-test and runs the editor's test
# (tools/desktop_test.py) on Windows and, from source, on Linux. Every run keeps the archive as an artifact of the run.
# A pushed tag that starts with v, or a manual run with a release tag given, also publishes it as a GitHub release.
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this new tag, made on the commit the run builds (for example v1.0.0)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - .github/workflows/app.yml
      - app/**
      - desktop/**
      - mod/**
      - patches/**
      - web/**
      - prepare.py
      - core.py
      - setup.sh
      - tools/bps.py
      - tools/build_app.py
      - tools/build_xref.py
      - tools/custom_model.py
      - tools/desktop_fixture.py
      - tools/desktop_test.py
      - tools/hw_check.py
      - tools/game_banks.py
      - tools/kit.py
      - tools/make_test_model.py
      - tools/mod_patch.py
      - tools/pycmd.py
      - kit/**
  pull_request:
    paths:
      - .github/workflows/app.yml
      - app/**
      - desktop/**
      - mod/**
      - patches/**
      - web/**
      - prepare.py
      - core.py
      - setup.sh
      - tools/bps.py
      - tools/build_app.py
      - tools/build_xref.py
      - tools/custom_model.py
      - tools/desktop_fixture.py
      - tools/desktop_test.py
      - tools/hw_check.py
      - tools/game_banks.py
      - tools/kit.py
      - tools/make_test_model.py
      - tools/mod_patch.py
      - tools/pycmd.py
      - kit/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      # Keep files byte for byte: the patches in patches/ must apply to vendor/libgarib on Windows too.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r app/requirements.txt
      - run: python tools/build_app.py
        env:
          APP_VERSION: ${{ inputs.release || github.ref_name }}
      # The runner has no graphics card. Mesa's llvmpipe, installed as the system's OpenGL driver (System32, where Qt
      # and PyOpenGL both load it from), gives the editor's test OpenGL 3.3. The app itself never includes Mesa.
      - name: Mesa (llvmpipe)
        shell: pwsh
        run: |
          $v = "26.2.4"
          curl.exe -fsSL --retry 3 -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$v/mesa3d-$v-release-msvc.7z"
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash -ne "351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695") { throw "mesa.7z hash" }
          7z x mesa.7z -omesa -y | Out-Null
          cmd /c "mesa\systemwidedeploy.cmd 1"
          # Without admin rights the script starts itself again elevated and exits 0: check that it worked
          if (-not (Test-Path "$env:windir\System32\mesadrv.dll")) { throw "Mesa was not deployed" }
          reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL" /v DLL
      # The screen is 1024x768 and the test's window 1500x950. GitHub doesn't document changing it, so this may fail.
      - name: Screen size
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      # The desktop editor on made-up levels (no ROM), with the libraries the app was built with
      - run: python tools/desktop_test.py --shots build/shots
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: windows
          GALLIUM_DRIVER: llvmpipe
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-windows
          path: build/shots
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: Glovebox-windows
          path: build/app/Glovebox-*.zip
          if-no-files-found: error
          # The release job attaches the archive to the release, so the run's copy is only kept for a week.
          retention-days: 7

  # The editor's test from source on Linux too (Xvfb and Mesa). The app is not built here.
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libgl1-mesa-dri xvfb
      - run: python -m pip install -r app/requirements.txt
      # vendor/ at setup.sh's commits, with patches/ applied, as the app's build gets it
      - run: python -c "import sys; sys.path.insert(0, 'tools'); import build_app; build_app.vendor(); build_app.patch_libgarib()"
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" python tools/desktop_test.py

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [build, test-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # The app's archive only, not the test's pictures
          pattern: Glovebox-*
          path: dist
          merge-multiple: true
      # The GPL engines' sources go with the executables that contain them
      - run: python3 tools/build_app.py sources --out dist
      - run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release || github.ref_name }}
